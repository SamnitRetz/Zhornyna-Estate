<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нормування - Zhornyna Estate</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* Базові стилі, як на головній */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; font-family: 'Montserrat', sans-serif; }
        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.85)), url('bg.jpg?v=999');
            background-size: cover; background-position: bottom center; z-index: -1;
        }
        .container { display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        
        /* Мое меню */
        .top-nav { display: flex; gap: 25px; margin-bottom: 40px; margin-top: 20px; flex-wrap: wrap; justify-content: center; z-index: 20; }
        .top-nav a { text-decoration: none; color: #2d5a27; font-weight: 600; font-size: 1.1rem; transition: transform 0.3s ease; letter-spacing: 0.5px; }
        .top-nav a:hover { color: #1a3616; transform: translateY(-2px); }

        /* Контентна частина */
        h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.5rem, 4vw, 2.5rem); color: #2d5a27; margin-bottom: 20px; text-align: center; }
        .subtitle { font-size: 1.1rem; color: #333; max-width: 600px; text-align: center; margin-bottom: 40px; line-height: 1.6; font-weight: 300; }

        /* Стилі карток років */
        .cards-wrapper {
            display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; width: 100%; max-width: 800px;
        }
        .year-card {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid #2d5a27;
            border-radius: 8px;
            padding: 40px;
            width: 250px;
            text-align: center;
            text-decoration: none;
            color: #2d5a27;
            transition: all 0.3s ease;
        }
        .year-card h2 { font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 10px; }
        .year-card p { font-size: 0.9rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .year-card:hover {
            background: #2d5a27;
            color: #fff;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(45, 90, 39, 0.2);
        }

        @media (max-width: 480px) {
            .top-nav { gap: 15px; margin-bottom: 30px; font-size: 0.95rem; }
            .year-card { width: 100%; max-width: 300px; }
        }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>
    <main class="container">
        <nav class="top-nav">
            <a href="index.html">Головна</a>
            <!-- Інші посилання -->
        </nav>

        <h1>Нормування у чаї та тізанах</h1>
        <p class="subtitle">Еволюція вимог до показників безпеки чаю.</p>

        <div class="cards-wrapper">
            <a href="standards-2024.html" class="year-card">
                <h2>2024</h2>
                <p>Редакція</p>
            </a>
            <a href="standards-2026.html" class="year-card">
                <h2>2026</h2>
                <p>Редакція</p>
            </a>
        </div>
    </main>
</body>
</html>
